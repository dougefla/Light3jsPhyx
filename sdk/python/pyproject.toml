[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightphyx"
version = "0.1.0"
description = "Agent-friendly Python SDK for the light-3js-phyx articulated-object simulation engine"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.21",
    "websocket-client>=1.6",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["lightphyx*"]
