name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx vitest run

      - name: Install Playwright Chromium (+ system deps)
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Headless end-to-end smoke (SwiftShader)
        run: URDF_PATH="$PWD/tests/assets/mini_cabinet.urdf" node tests/smoke/headless.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python SDK e2e
        run: |
          pip install -e "sdk/python[test]"
          URDF_PATH="$PWD/tests/assets/mini_cabinet.urdf" python -m pytest sdk/python/tests -q
